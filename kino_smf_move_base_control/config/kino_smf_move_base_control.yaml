kino_smf_move_base_controller:
  ros__parameters:
    use_sim_time: false # true in simulation
    # Control parameters
    max_trans_vel: 0.5
    max_rot_vel: 1.5
    goal_tolerance: 0.01

    query_goal_topic: /goal_pose
    control_path_topic: /kino_smf_move_base_planner/solution_path
    control_output_topic: /cmd_vel
    odometry_topic: /odom
    robot_frame: "base_footprint"
    stop_motion_topic: /stop_motion
    sweep_motion_topic: /sweep_motion
